name: k8 CI Workflow

on:
  push:   # trigger on every push

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub hosted runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4   # clone repo

      - name: Setup Docker
        uses: docker/setup-buildx-action@v4   # enable docker buildx

      - name: Login to DockerHub
        uses: docker/login-action@v4   # authenticate Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set IMAGE_NAME environment variable
        run: echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_REPO }}:github" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .   # ⚠️ space before dot

      - name: Push Docker image
        run: docker push $IMAGE_NAME
